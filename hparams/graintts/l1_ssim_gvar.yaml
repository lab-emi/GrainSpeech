block_depth: 2
constant_lr: false
decoder_kernel_size: 5
depth: 1
duration_weight: 1.0
embed_dim: 128
energy_weight: 2.0
expansion: 1
gvar_weight: 0.5
head: 1
hifigan_checkpoint: hifigan/LJ_V2/generator_v2
infer_device: cuda
kernel_size: 3
l1_weight: 1.0
lr: 0.001
max_epochs: 5000
mel_weight: 5.0
n_blocks: 2
pitch_weight: 2.0
preprocess_config:
  dataset: LJSpeech
  path:
    corpus_path: data/LJSpeech-1.1
    preprocessed_path: preprocessed_data/LJSpeech
  preprocessing:
    audio:
      max_wav_value: 32768.0
      sampling_rate: 22050
    energy:
      feature: phoneme_level
      normalization: true
    mel:
      mel_fmax: 8000
      mel_fmin: 0
      n_mel_channels: 80
    pitch:
      feature: phoneme_level
      normalization: true
    stft:
      filter_length: 1024
      hop_length: 256
      win_length: 1024
    text:
      language: en
      max_length: 4096
      text_cleaners:
      - english_cleaners
    val_size: 512
reduction: 4
ssim_k1: 0.01
ssim_k2: 0.03
ssim_kernel_freq: 5
ssim_kernel_time: 11
ssim_sigma_freq: 1.0
ssim_sigma_time: 1.5
ssim_weight: 1.0
verbose: false
wav_path: val_outputs
weight_decay: 1.0e-05
